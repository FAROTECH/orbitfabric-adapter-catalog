# Historical release identity regression: FAROTECH coordinates below are immutable.
name: Product consumer E2E

on:
  pull_request:
    paths:
      - catalog.json
      - e2e/**
      - tools/product_consumer_e2e.py
      - .github/workflows/product-consumer-e2e.yml
  push:
    branches:
      - main
    paths:
      - catalog.json
      - e2e/**
      - tools/product_consumer_e2e.py
      - .github/workflows/product-consumer-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ORBITFABRIC_CORE_REPOSITORY: OrbitFabric/orbitfabric
  ORBITFABRIC_CORE_REF: 8037759580f251714b3d0ddd9b5ed7058e161d3c
  ORBITFABRIC_RELEASE_SOURCE_REPOSITORY: OrbitFabric/orbitfabric-github-release-source
  ORBITFABRIC_RELEASE_SOURCE_REF: d3756262f9bc2f22bde789a8c06db8944b6dc120

jobs:
  product-consumer-e2e:
    name: ${{ matrix.adapter }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - authority: github.com/FAROTECH
            adapter: openobsw-opensvf
            version: 0.1.0
            lock: e2e/locks/openobsw-opensvf-0.1.0.json
          - authority: github.com/FAROTECH
            adapter: openc3-cosmos
            version: 0.1.0
            lock: e2e/locks/openc3-cosmos-0.1.0.json
          - authority: github.com/OrbitFabric
            adapter: openc3-cosmos
            version: 0.2.0
            lock: e2e/locks/openc3-cosmos-0.2.0.json
          - authority: github.com/FAROTECH
            adapter: fprime
            version: 0.1.1
            lock: e2e/locks/fprime-0.1.1.json
          - authority: github.com/FAROTECH
            adapter: fprime
            version: 0.1.2
            lock: e2e/locks/fprime-0.1.2.json
          - authority: github.com/FAROTECH
            adapter: eds-cfs
            version: 0.1.0
            lock: e2e/locks/eds-cfs-0.1.0.json

          - authority: github.com/OrbitFabric
            adapter: fprime
            version: 0.1.3
            lock: e2e/locks/fprime-0.1.3.json
          - authority: github.com/OrbitFabric
            adapter: eds-cfs
            version: 0.1.1
            lock: e2e/locks/eds-cfs-0.1.1.json
          - authority: github.com/OrbitFabric
            adapter: openc3-cosmos
            version: 0.2.1
            lock: e2e/locks/openc3-cosmos-0.2.1.json
          - authority: github.com/OrbitFabric
            adapter: openobsw-opensvf
            version: 0.1.1
            lock: e2e/locks/openobsw-opensvf-0.1.1.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact OrbitFabric Core P0 baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${ORBITFABRIC_CORE_REPOSITORY}.git@${ORBITFABRIC_CORE_REF}"

      - name: Install exact GitHub Release Source P1 baseline
        run: |
          python -m pip install --no-deps "git+https://github.com/${ORBITFABRIC_RELEASE_SOURCE_REPOSITORY}.git@${ORBITFABRIC_RELEASE_SOURCE_REF}"

      - name: Execute product consumer E2E
        run: |
          python tools/product_consumer_e2e.py \
            --catalog-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/catalog.json" \
            --authority "${{ matrix.authority }}" \
            --adapter "${{ matrix.adapter }}" \
            --version "${{ matrix.version }}" \
            --lock "${{ matrix.lock }}"
