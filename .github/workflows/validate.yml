name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Catalog validation (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact OrbitFabric Core P0 baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/FAROTECH/orbitfabric.git@4ba7a0b51a071b91150be4271fef6c6010bc80fd"
      - name: Install validation tooling
        run: python -m pip install "pytest>=8.0" "ruff>=0.5"
      - name: Ruff
        run: ruff check .
      - name: Unit and baseline checks
        run: pytest
      - name: Validate catalog data
        run: python tools/validate_catalog.py catalog.json
